<svg xmlns="http://www.w3.org/2000/svg" viewBox="22 28 210 112" role="img" aria-labelledby="t">
  <title id="t">Whetstone: a two-grit sharpening stone with a glint</title>
  <!-- A combination whetstone: a coarse clay half for learning, a fine steel half for mastery,
       and the glint of a freshly honed edge. -->
  <g stroke-linejoin="round">
    <!-- front and side faces -->
    <path d="M30 92 L130 112 L130 132 L30 112 Z" fill="#9C4526"/>
    <path d="M130 112 L210 82 L210 102 L130 132 Z" fill="#244C77"/>
    <!-- top face: coarse grit (clay) and fine grit (steel) -->
    <path d="M30 92 L110 62 L160 72 L80 102 Z" fill="#D97757"/>
    <path d="M80 102 L160 72 L210 82 L130 112 Z" fill="#4A7FB8"/>
    <path d="M80 102 L160 72" stroke="#F5F4EF" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <g fill="#F5F4EF" opacity="0.55">
      <circle cx="62" cy="88" r="1.6"/><circle cx="78" cy="82" r="1.3"/><circle cx="95" cy="76" r="1.6"/>
      <circle cx="70" cy="95" r="1.2"/><circle cx="88" cy="89" r="1.5"/><circle cx="104" cy="83" r="1.2"/>
      <circle cx="118" cy="74" r="1.4"/><circle cx="54" cy="94" r="1.1"/>
    </g>
  </g>
  <!-- the glint: a large and a small four-point sparkle -->
  <g fill="#E0A84F">
    <path d="M196 38 Q198 56 216 58 Q198 60 196 78 Q194 60 176 58 Q194 56 196 38 Z"/>
    <path d="M222 32 Q223 40 230 41 Q223 42 222 50 Q221 42 214 41 Q221 40 222 32 Z"/>
  </g>
</svg>
