[project]
name = "whetstone"
version = "0.1.0"
description = "A self-hosted practice dojo: lessons, hands-on challenges, and pytest-graded solutions."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pytest>=8.0",
  "PyYAML>=6.0",
  "Markdown>=3.5",
  "redis>=5.0",
  "anthropic>=0.40",
]

[project.scripts]
whetstone = "whetstone.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["whetstone*"]

[tool.setuptools.package-data]
whetstone = ["static/*"]
