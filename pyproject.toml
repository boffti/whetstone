[project]
name = "whetstone"
version = "0.1.0"
description = "A self-hosted practice dojo where your own AI agent builds the lessons: learning paths, hands-on questions, pytest grading."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pytest>=8.0",
  "PyYAML>=6.0",
  "Markdown>=3.5",
  "redis>=5.0",
  "anthropic>=0.40",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/boffti/whetstone"
Issues = "https://github.com/boffti/whetstone/issues"
Security = "https://github.com/boffti/whetstone/security/policy"

[project.scripts]
whetstone = "whetstone.__main__:main"

[dependency-groups]
demo = [
    "fonttools>=4.50",
    "pillow>=10",
    "playwright>=1.47",
]
dev = ["ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["whetstone*"]

[tool.setuptools.package-data]
whetstone = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["my", "data"]

[tool.ruff.format]
exclude = ["*.md"]  # lessons align comments in code samples on purpose

[tool.ruff.lint]
# Errors, pyflakes, imports, bugbear, pyupgrade.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # `ruff format` owns line length; long strings are allowed
